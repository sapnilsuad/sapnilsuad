<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sapnil - Full-Stack Developer, Founder, Product Builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#17113F"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#A78BFA;#F472B6;#22D3EE" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#F472B6">
        <animate attributeName="stop-color" values="#F472B6;#22D3EE;#A78BFA;#F472B6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- floating gradient orbs -->
    <g filter="url(#blur)">
      <circle cx="190" cy="90" r="120" fill="#6366F1" opacity="0.75">
        <animateTransform attributeName="transform" type="translate" values="0 0; 140 70; 0 0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="300" r="130" fill="#EC4899" opacity="0.55">
        <animateTransform attributeName="transform" type="translate" values="0 0; -120 -60; 0 0" dur="17s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1040" cy="70" r="120" fill="#22D3EE" opacity="0.55">
        <animateTransform attributeName="transform" type="translate" values="0 0; -150 80; 0 0" dur="19s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- glass panel -->
    <rect x="90" y="50" width="1020" height="220" rx="30" fill="url(#glass)"/>
    <rect x="90.5" y="50.5" width="1019" height="219" rx="29.5" stroke="url(#rim)" stroke-width="1.2"/>

    <!-- window dots -->
    <circle cx="132" cy="84" r="6" fill="#F472B6" opacity="0.9"/>
    <circle cx="154" cy="84" r="6" fill="#A78BFA" opacity="0.9"/>
    <circle cx="176" cy="84" r="6" fill="#22D3EE" opacity="0.9"/>

    <!-- text -->
    <text x="600" y="168" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="2" fill="url(#name)">SAPNIL</text>
    <text x="600" y="210" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="500" letter-spacing="3" fill="#E2E8F0">FULL-STACK DEVELOPER  ·  FOUNDER  ·  PRODUCT BUILDER</text>
    <text x="600" y="242" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="1.5" fill="#94A3B8">NIVE Inc.   ·   Qunnix   ·   Bangladesh</text>
  </g>
</svg>
