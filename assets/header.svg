<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sapnil - Full-Stack Developer and Founder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 140) rotate(90) scale(260 460)">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0F19" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0B0F19" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0B0F19" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="280" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="280" fill="#0B0F19"/>
    <rect width="1200" height="280" fill="url(#grid)"/>
    <rect width="1200" height="280" fill="url(#glow)"/>

    <!-- layered stack motif -->
    <g stroke-linejoin="round">
      <path d="M1010 168 L1110 213 L1010 258 L910 213 Z" fill="#6366F1" fill-opacity="0.05" stroke="#6366F1" stroke-opacity="0.30"/>
      <path d="M1010 128 L1110 173 L1010 218 L910 173 Z" fill="#6366F1" fill-opacity="0.08" stroke="#818CF8" stroke-opacity="0.50"/>
      <path d="M1010 88 L1110 133 L1010 178 L910 133 Z" fill="#6366F1" fill-opacity="0.14" stroke="#A5B4FC" stroke-opacity="0.85"/>
    </g>

    <!-- text -->
    <rect x="80" y="82" width="44" height="3" rx="1.5" fill="#6366F1"/>
    <text x="80" y="150" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#F9FAFB">Sapnil</text>
    <text x="82" y="190" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#9CA3AF">Full-Stack Developer  ·  Founder  ·  Product Builder</text>
    <text x="82" y="226" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#6B7280" letter-spacing="0.3">NIVE Inc.   /   Qunnix   /   Bangladesh</text>

    <rect x="0.5" y="0.5" width="1199" height="279" rx="13.5" stroke="#FFFFFF" stroke-opacity="0.08"/>
  </g>
</svg>
